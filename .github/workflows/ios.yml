name: Build de pesquisa iOS
on:
  workflow_dispatch:
    inputs:
      task:
        description: Rotina de pesquisa
        type: choice
        default: iphone
        options:
          - iphone
          - verificar
permissions:
  contents: read
jobs:
  iphone:
    if: github.event.repository.private == false && inputs.task != 'verificar'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Conferir Xcode e Metal
        run: |
          xcodebuild -version
          if ! xcrun --sdk iphoneos metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          xcrun --sdk iphoneos metal --version
      - name: Compilar o IPA
        run: bash scripts/build.sh
      - name: Cifrar o artefato
        env:
          RECIPIENT: ${{ vars.FOCO_ARTIFACT_CERT }}
        run: |
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in build/Foco-sem-assinatura.ipa -out build/Foco.ipa.cms "$RUNNER_TEMP/recipient.pem"
          shasum -a 256 build/Foco-sem-assinatura.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Foco-cifrado
          path: build/Foco.ipa.cms
          retention-days: 1
  verificar:
    if: github.event.repository.private == false && inputs.task == 'verificar'
    runs-on: xcode-27
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Testar JPEG e inferência Core ML
        run: |
          sw_vers
          xcodebuild -version
          bash scripts/verify-native.sh

