name: Build de pesquisa iOS
on: workflow_dispatch
permissions:
  contents: read
jobs:
  iphone:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Selecionar Xcode e conferir Metal
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then sudo xcode-select -s /Applications/Xcode_16.4.app; fi
          xcodebuild -version
          xcrun --sdk iphoneos metal --version
      - name: Compilar o IPA
        run: bash scripts/build.sh
      - name: Cifrar o artefato
        env:
          RECIPIENT: ${{ vars.FOCO_ARTIFACT_CERT }}
        run: |
          printf '%s\n' "$RECIPIENT" > "$RUNNER_TEMP/recipient.pem"
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in build/Foco-sem-assinatura.ipa -out build/Foco.ipa.cms "$RUNNER_TEMP/recipient.pem"
          shasum -a 256 build/Foco-sem-assinatura.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Foco-cifrado
          path: build/Foco.ipa.cms
          retention-days: 1

